remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

locale: ja-JP
title: "動く板Project"
subtitle: "IoTスマートデバイスの開発プロジェクト"
name: "動く板Project Team"
description: "特定の用途に縛られず、様々なシステムやハードウェアと容易に連携・拡張が可能なIoTスマートデバイス「動く板NEO」の開発プロジェクト"
url: "https://ugokuita-project.github.io"
repository: "ugokuita-project/ugokuita-project.github.io"

# Site Settings
search: true
search_full_content: true

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false 
